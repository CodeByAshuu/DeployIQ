# Server Configuration
server.port=8080
spring.application.name=analytics-service

# Database Connection (Reads from existing DeployIQ Postgres DB)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/deployiq_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:deployiq}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate Configurations (Read-only setup)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Enable JSON serialization naming matching camelCase for frontend
spring.jackson.property-naming-strategy=LOWER_CAMEL_CASE
