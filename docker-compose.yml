services:
  reverse-proxy:
    image: nginx:alpine
    ports:
      - "8082:80"
    depends_on:
      - frontend
      - auth-service
      - analytics-service

  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      - VITE_API_URL=http://localhost:3001/api
    depends_on:
      - auth-service
    restart: unless-stopped

  auth-service:
    build:
      context: ./backend/auth-service
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql://deployiq:password@postgres:5432/deployiq_db
      - JWT_SECRET=supersecret
    depends_on:
      - postgres
    ports:
      - "3001:3001"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./deployments:/app/deployments
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3001/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 3

  # deployment-service:
  #   build:
  #     context: ./backend/deployment-service
  #     dockerfile: Dockerfile
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock # Allows dockerode to manage containers
  #   environment:
  #     - PORT=3002

  # monitoring-service:
  #   build:
  #     context: ./backend/monitoring-service
  #     dockerfile: Dockerfile
  #   environment:
  #     - PORT=3003

  analytics-service:
    build:
      context: ./analytics-service
      dockerfile: Dockerfile
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/deployiq_db
      - SPRING_DATASOURCE_USERNAME=deployiq
      - SPRING_DATASOURCE_PASSWORD=password
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8080/api/analytics/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: deployiq
      POSTGRES_PASSWORD: password
      POSTGRES_DB: deployiq_db
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deployiq -d deployiq_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
