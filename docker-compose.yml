services:
  reverse-proxy:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - auth-service
      # - deployment-service
      # - analytics-service

  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      - VITE_API_URL=http://localhost:3001/api
    depends_on:
      - auth-service

  auth-service:
    build:
      context: ./backend/auth-service
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql://deployiq:password@postgres:5432/deployiq_db
      - JWT_SECRET=supersecret
    depends_on:
      - postgres
    ports:
      - "3001:3001"

  # deployment-service:
  #   build:
  #     context: ./backend/deployment-service
  #     dockerfile: Dockerfile
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock # Allows dockerode to manage containers
  #   environment:
  #     - PORT=3002

  # monitoring-service:
  #   build:
  #     context: ./backend/monitoring-service
  #     dockerfile: Dockerfile
  #   environment:
  #     - PORT=3003

  # analytics-service:
  #   build:
  #     context: ./analytics-service
  #     dockerfile: Dockerfile
  #   environment:
  #     - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/deployiq_db
  #     - SPRING_DATASOURCE_USERNAME=deployiq
  #     - SPRING_DATASOURCE_PASSWORD=password
  #   depends_on:
  #     - postgres

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: deployiq
      POSTGRES_PASSWORD: password
      POSTGRES_DB: deployiq_db
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
