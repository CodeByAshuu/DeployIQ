name: DeployIQ CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # ------------------- Node / Frontend -------------------
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |        
            frontend/package-lock.json
            backend/auth-service/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Frontend
        working-directory: ./frontend
        run: npm run build

      # ------------------- Backend (Auth Service) -------------------
      - name: Install Backend Dependencies
        working-directory: ./backend/auth-service
        run: npm ci

      - name: Generate Prisma Client
        working-directory: ./backend/auth-service
        run: npx prisma generate

      # ------------------- Java / Analytics Service -------------------
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Ensure Maven Wrapper Executable
        working-directory: ./analytics-service
        run: chmod +x mvnw

      - name: Build Analytics Service
        working-directory: ./analytics-service
        run: ./mvnw clean package -DskipTests

      # ------------------- Docker Compose Validation -------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Validate Docker Compose configuration
        run: docker compose config

      # ------------------- Optional: Docker Build (for CI verification) -------------------
      - name: Build Docker Images
        run: docker compose build
